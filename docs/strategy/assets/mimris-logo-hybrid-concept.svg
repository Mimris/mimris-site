<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Mimris open-core M logo refinement</title>
  <desc id="desc">A focused logo refinement combining the connected M silhouette with the open knowledge-model diamond.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e8}.card{fill:#fffefa;stroke:#17201d;stroke-opacity:.16}.ink{fill:#17201d}.green{fill:#246a4b}.muted{fill:#56605c}.white{fill:#fffefa}.heading{font:800 34px Inter,system-ui,sans-serif;letter-spacing:-1px}.subheading{font:800 24px Inter,system-ui,sans-serif;letter-spacing:-.7px}.body{font:500 17px Inter,system-ui,sans-serif}.label{font:800 14px Inter,system-ui,sans-serif;letter-spacing:1.8px}.note{font:650 14px Inter,system-ui,sans-serif}.word{font:800 46px Inter,system-ui,sans-serif;letter-spacing:-1.5px}.smallword{font:800 22px Inter,system-ui,sans-serif;letter-spacing:-.7px}.hybrid-line{fill:none;stroke:currentColor;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}.hybrid-node{fill:currentColor}.source-line{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.source-node{fill:currentColor}
    </style>
    <g id="hybrid-mark">
      <path class="hybrid-line" d="M8 58V10l17 28 11 11 11-11 17-28v48"/>
      <path class="hybrid-line" d="m36 27 11 11-11 11-11-11Z"/>
      <circle class="hybrid-node" cx="8" cy="10" r="6.5"/>
      <circle class="hybrid-node" cx="8" cy="58" r="6.5"/>
      <circle class="hybrid-node" cx="64" cy="10" r="6.5"/>
      <circle class="hybrid-node" cx="64" cy="58" r="6.5"/>
      <circle class="hybrid-node" cx="25" cy="38" r="5"/>
      <circle class="hybrid-node" cx="47" cy="38" r="5"/>
    </g>
    <g id="knowledge-source">
      <path class="source-line" d="M18 8 8 34l18 22h20l18-22L54 8M18 8h36M8 34h20m16 0h20M26 56l10-22 10 22"/>
      <path class="source-line" d="m36 22 10 12-10 12-10-12Z"/>
      <circle class="source-node" cx="18" cy="8" r="5"/><circle class="source-node" cx="54" cy="8" r="5"/><circle class="source-node" cx="8" cy="34" r="5"/><circle class="source-node" cx="64" cy="34" r="5"/><circle class="source-node" cx="26" cy="56" r="5"/><circle class="source-node" cx="46" cy="56" r="5"/>
    </g>
    <g id="m-source">
      <path class="source-line" d="M6 56V10l30 31 30-31v46"/>
      <circle class="source-node" cx="6" cy="56" r="5"/><circle class="source-node" cx="6" cy="10" r="5"/><circle class="source-node" cx="36" cy="41" r="5"/><circle class="source-node" cx="66" cy="10" r="5"/><circle class="source-node" cx="66" cy="56" r="5"/>
    </g>
  </defs>

  <rect class="bg" width="1440" height="960"/>
  <text x="72" y="72" class="label green">MIMRIS · FOCUSED LOGO REFINEMENT</text>
  <text x="72" y="120" class="heading ink">Open-core M</text>
  <text x="72" y="154" class="body muted">Alt 2 supplies the recognizable M silhouette. Alt 1 supplies the relational nodes and the open model at its centre.</text>

  <g transform="translate(72 202)">
    <rect class="card" width="850" height="620" rx="28"/>
    <text x="34" y="48" class="label green">PROPOSED HYBRID</text>
    <text x="34" y="88" class="subheading ink">One continuous system, with knowledge left open</text>
    <g transform="translate(319 144) scale(3)" style="color:#246a4b"><use href="#hybrid-mark"/></g>
    <g transform="translate(223 405) scale(1.15)" style="color:#17201d"><use href="#hybrid-mark"/></g>
    <text x="338" y="468" class="word ink">Mimris</text>
    <line x1="34" y1="520" x2="816" y2="520" stroke="#17201d" stroke-opacity=".14"/>
    <text x="34" y="559" class="note muted">The diamond is not placed on top of the M: its lower edges form the M’s central valley.</text>
    <text x="34" y="584" class="note muted">That shared geometry keeps the idea integrated and preserves a true one-colour construction.</text>
  </g>

  <g transform="translate(950 202)">
    <rect class="card" width="418" height="294" rx="28"/>
    <text x="30" y="45" class="label green">DESIGN DNA</text>
    <g transform="translate(58 86) scale(1.15)" style="color:#17201d"><use href="#knowledge-source"/></g>
    <text x="151" y="130" class="heading muted">+</text>
    <g transform="translate(212 86) scale(1.15)" style="color:#246a4b"><use href="#m-source"/></g>
    <text x="30" y="214" class="smallword ink">Open model</text>
    <text x="212" y="214" class="smallword ink">Connected M</text>
    <text x="30" y="252" class="body muted">Structure from Alt 1; recognition from Alt 2.</text>
  </g>

  <g transform="translate(950 528)">
    <rect class="card" width="418" height="294" rx="28"/>
    <text x="30" y="45" class="label green">SMALL-SIZE &amp; ONE-COLOUR CHECK</text>
    <g transform="translate(34 83) scale(.25)" style="color:#17201d"><use href="#hybrid-mark"/></g>
    <g transform="translate(105 77) scale(.375)" style="color:#17201d"><use href="#hybrid-mark"/></g>
    <g transform="translate(191 69) scale(.5)" style="color:#246a4b"><use href="#hybrid-mark"/></g>
    <g transform="translate(291 61) scale(.75)" style="color:#17201d"><use href="#hybrid-mark"/></g>
    <text x="33" y="171" class="note muted">16</text><text x="104" y="171" class="note muted">24</text><text x="190" y="171" class="note muted">32</text><text x="290" y="171" class="note muted">48 px</text>
    <rect x="30" y="204" width="170" height="62" rx="12" class="green"/>
    <g transform="translate(51 218) scale(.5)" style="color:#fffefa"><use href="#hybrid-mark"/></g>
    <text x="101" y="242" class="smallword white">Mimris</text>
    <rect x="218" y="204" width="170" height="62" rx="12" fill="#17201d"/>
    <g transform="translate(239 218) scale(.5)" style="color:#fffefa"><use href="#hybrid-mark"/></g>
    <text x="289" y="242" class="smallword white">Mimris</text>
  </g>

  <text x="72" y="892" class="body ink">Discussion point: does the open diamond make the M more distinctive, or does it add too much detail at application-header size?</text>
  <text x="72" y="922" class="body muted">Concept drawing only · optical balancing, spacing, and production masters remain deferred until selection.</text>
</svg>

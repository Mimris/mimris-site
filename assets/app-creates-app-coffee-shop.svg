<svg xmlns="http://www.w3.org/2000/svg" width="640" height="832" viewBox="0 0 640 832" role="img" aria-labelledby="title desc">
<title id="title">From coffee-shop knowledge to an app</title><desc id="desc">Intended design path: understand coffee-shop work, model its tasks and information, compile an operational model, validate in Preview, then generate the application. Preview and the Generated Application use the same compiled model.</desc>
<rect width="640" height="832" rx="16" fill="#f3f0e7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#176b50" stroke-width="1.5"/></marker></defs>
<text x="320" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17302a">From coffee-shop knowledge to an app</text>
<rect x="36" y="82" width="568" height="92" rx="12" fill="#e5eee5" stroke="#176b50"/>
<text x="320" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Understand the coffee shop</text>
<text x="320" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Orders · payment · drinks · handover</text>
<path d="M320,174 V199" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="208" width="568" height="92" rx="12" fill="#fffdf7" stroke="#176b50"/>
<text x="320" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Model the work</text>
<text x="320" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Roles · tasks · information · rules</text>
<path d="M320,300 V325" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="334" width="568" height="92" rx="12" fill="#e5eee5" stroke="#176b50"/>
<text x="320" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Compile the operational model</text>
<text x="320" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">One shared basis for preview and delivery</text>
<path d="M320,426 V451" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="460" width="568" height="92" rx="12" fill="#fffdf7" stroke="#176b50"/>
<text x="320" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Try it in Operational Preview</text>
<text x="320" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Walk through sample orders and review</text>
<path d="M320,552 V577" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="586" width="568" height="92" rx="12" fill="#e5eee5" stroke="#176b50"/>
<text x="320" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Create the Generated Application</text>
<text x="320" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Tasks · Guide · AI-assisted execution</text>
<text x="320" y="799" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#344c43">Intended process · Preview validates before delivery</text></svg>

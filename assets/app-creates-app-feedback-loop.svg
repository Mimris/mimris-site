<svg xmlns="http://www.w3.org/2000/svg" width="640" height="832" viewBox="0 0 640 832" role="img" aria-labelledby="title desc">
<title id="title">Improve the application through review</title><desc id="desc">Goal, Generate, Review, Learn, Refine, then repeat. A missing drink preference becomes a reviewed change to the appropriate source, followed by another generation and check.</desc>
<rect width="640" height="832" rx="16" fill="#f3f0e7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#176b50" stroke-width="1.5"/></marker></defs>
<text x="320" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17302a">Improve the application through review</text>
<rect x="36" y="82" width="568" height="92" rx="12" fill="#e5eee5" stroke="#176b50"/>
<text x="320" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Goal</text>
<text x="320" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Pass drink preferences to the barista</text>
<path d="M320,174 V199" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="208" width="568" height="92" rx="12" fill="#fffdf7" stroke="#176b50"/>
<text x="320" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Generate</text>
<text x="320" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Build from the reviewed design</text>
<path d="M320,300 V325" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="334" width="568" height="92" rx="12" fill="#e5eee5" stroke="#176b50"/>
<text x="320" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Review</text>
<text x="320" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Try an order: is a preference missing?</text>
<path d="M320,426 V451" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="460" width="568" height="92" rx="12" fill="#fffdf7" stroke="#176b50"/>
<text x="320" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Learn</text>
<text x="320" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Find the cause in the form or model</text>
<path d="M320,552 V577" stroke="#176b50" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="586" width="568" height="92" rx="12" fill="#e5eee5" stroke="#176b50"/>
<text x="320" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17302a">Refine → repeat</text>
<text x="320" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#344c43">Approve the change, regenerate, and check</text>
<text x="320" y="799" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#344c43">People review changes and check the next result</text></svg>
